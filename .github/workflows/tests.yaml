name: Unit Tests

on: [push]

jobs:
  build_test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - uses: actions/checkout@v4
      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test
        run: scripts/test
      - name: Lint
        run: scripts/lint
      - name: Typecheck
        run: scripts/typecheck
